<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Sign in to the AltSchool Student Portal">
  <title>Sign Up or Sign In | AltSchool Africa</title>
</head>
<body>
  <header>
    <nav aria-label="Global navigation">
      <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="form.html" aria-current="page">Sign In Form</a></li>
      </ul>
    </nav>
  </header>

  <main id="main-content">
    <nav aria-label="Account tabs">
      <ul>
        <li><a href="#">Sign up</a></li>
        <li><a href="form.html" aria-current="page">Sign in</a></li>
      </ul>
    </nav>

    <section aria-labelledby="sign-in-heading">
      <h1 id="sign-in-heading">Sign in</h1>
      <p>Enter your email address and password to securely log in to AltSchool Student Portal</p>

      <form action="#" method="post">
        <p>
          <label for="email">Email</label><br>
          <input type="email" id="email" name="email" placeholder="onye.marv@example.com" autocomplete="email" required>
        </p>

        <p>
          <label for="password">Password</label><br>
          <input type="password" id="password" name="password" placeholder="********" autocomplete="current-password" required>
        </p>

        <p>
          <button type="submit">Proceed to Dashboard &rarr;</button>
        </p>
      </form>

      <p>Forgot your password? <a href="#">Reset Now!</a></p>

      <p>OR</p>

      <p><button type="button">Login with Google</button></p>
    </section>
  </main>

  <footer>
    <address>
      Kajola, Ifo, Ogunstate, Nigeria
    </address>
    <p><small>&copy; 2026 Onyemechi Marvelous. All rights reserved.</small></p>
  </footer>
</body>
</html>
